site_name: UE Plugins Documentation
site_description: Documentation for Unreal Engine plugins by logdok.
site_url: https://logdok.github.io/ue-plugins-docs/
repo_url: https://github.com/logdok/ue-plugins-docs
repo_name: logdok/ue-plugins-docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
    - toc.follow

# Specifying this list replaces MkDocs' implicit default outright, so "search"
# has to be listed here explicitly or the site loses search entirely.
plugins:
  - search
  - git-revision-date-localized:
      type: date
      timezone: UTC
      fallback_to_build_date: true

# A page that exists under docs/ but is missing from nav below doesn't fail the build on
# its own - it just silently never appears in the menu, which is exactly how chapters
# 12-13 of S3 Compatible Storage went missing from the site after syncing fine. Turning
# this into a warning (which --strict then promotes to a build failure, see deploy.yml)
# makes that mistake break CI immediately instead of waiting for someone to notice an
# empty-looking menu.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
      # Default python-markdown slugify strips non-ASCII characters entirely, so
      # every Cyrillic heading collapses to an empty string and falls back to a
      # meaningless sequential id (_1, _2, ...) - breaking every #anchor link in
      # the Ukrainian chapters, including their own internal cross-references.
      # pymdownx.slugs.slugify keeps Unicode text (lowercased, spaces -> hyphens).
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

